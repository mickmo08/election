name: Deploy
# Requires repository/environment secrets: AWS_DEPLOY_ROLE_ARN (OIDC-assumable role), AWS_REGION, ECR_REGISTRY.
# Production deploys require manual approval via the `production` GitHub environment.
on:
  workflow_dispatch:
    inputs:
      environment: { description: "staging or production", required: true, default: staging }
      image_tag: { description: "Image tag (git SHA) to deploy", required: true }

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ secrets.AWS_REGION }}" }
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push images
        run: |
          docker build --build-arg ELECTION_APP_VERSION=${{ inputs.image_tag }} -t ${{ secrets.ECR_REGISTRY }}/election-api:${{ inputs.image_tag }} backend
          docker build --build-arg ELECTION_API_ORIGIN=http://api.election.internal:8000 -t ${{ secrets.ECR_REGISTRY }}/election-web:${{ inputs.image_tag }} frontend
          docker push ${{ secrets.ECR_REGISTRY }}/election-api:${{ inputs.image_tag }}
          docker push ${{ secrets.ECR_REGISTRY }}/election-web:${{ inputs.image_tag }}
      - name: Pre-deploy database backup + migrations (one-off ECS task)
        run: ./ops/deploy/run_migrations.sh "${{ inputs.environment }}" "${{ inputs.image_tag }}"
      - name: Roll out services (ECS circuit breaker auto-rolls back on failed health checks)
        run: ./ops/deploy/rollout.sh "${{ inputs.environment }}" "${{ inputs.image_tag }}"
      - name: Post-deploy smoke test
        run: ./ops/deploy/smoke.sh "https://${{ inputs.environment == 'production' && 'app' || 'staging' }}.election.example"
